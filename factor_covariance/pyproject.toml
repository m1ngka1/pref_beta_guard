[project]
name = "pred-beta-guard-factor-covariance"
version = "0.1.0"
description = "CVXPY beta constraints and closed-form factor covariance adjustment"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "cvxpy>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
