[project]
name = "pred-beta-guard-stock-covariance"
version = "0.1.0"
description = "Monotone beta floor and full covariance adjustment without a solver"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
